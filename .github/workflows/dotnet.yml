name: Shared .NET core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      MXH_TEST_SSH_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check paramiko==5.0.0
      - run: dotnet restore desktop/Mxh.VpsDeploy.Tests/Mxh.VpsDeploy.Tests.csproj --locked-mode
      - run: dotnet run --project desktop/Mxh.VpsDeploy.Tests/Mxh.VpsDeploy.Tests.csproj -c Release --no-restore -- "${{ github.workspace }}"
