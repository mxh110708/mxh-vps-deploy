name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run project tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -ProjectRoot $PWD
      - name: Validate generated configs with pinned sing-box
        shell: pwsh
        run: |
          $versions = Get-Content -Raw ./config/versions.json | ConvertFrom-Json
          $asset = $versions.sing_box.assets.windows_amd64
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$($versions.sing_box.version)/$($asset.name)"
          curl.exe -fsSL --retry 3 --output $archive $url
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $asset.sha256) { throw 'sing-box release checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'sing-box-check'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $core = Get-ChildItem $destination -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $core) { throw 'sing-box.exe not found' }
          ./tests/Test-SingBoxConfig.ps1 -ProjectRoot $PWD -SingBoxPath $core.FullName

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/remote/*.sh; do
            bash -n "$file"
          done
      - name: ShellCheck
        shell: bash
        run: shellcheck --severity=warning assets/remote/*.sh
      - name: Validate restricted nftables template
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          sudo env \
            VPS_PARAM_TCP_PORTS='30124,31235' \
            VPS_PARAM_RESTRICTED_PORT='33456' \
            VPS_PARAM_ALLOWED_IPV4S='192.0.2.30,192.0.2.31' \
            VPS_PARAM_ALLOWED_IPV6S='2001:db8::30' \
            VPS_PARAM_CHECK_ONLY='true' \
            bash assets/remote/nftables-apply.sh
      - name: Validate conservative adaptive network template
        shell: bash
        run: |
          for role in RealityEntry AnyTlsEntry; do
            env \
              VPS_PARAM_ROLE="$role" \
              VPS_PARAM_MEMORY_KIB='1048576' \
              VPS_PARAM_MODE='AdaptiveConservative' \
              VPS_PARAM_BANDWIDTH_MBPS='100' \
              VPS_PARAM_REFERENCE_RTT_MS='160' \
              VPS_PARAM_BUFFER_TARGET_BYTES='4000000' \
              VPS_PARAM_BUFFER_CAP_BYTES='8388608' \
              VPS_PARAM_QUEUE_FLOOR='1024' \
              VPS_PARAM_PROFILE='entry-small-adaptive' \
              VPS_PARAM_CHECK_ONLY='true' \
              bash assets/remote/network-tuning.sh | grep -Fx 'VPSDEPLOY_NETWORK_CHECK_OK'
          done
