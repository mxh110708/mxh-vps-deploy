  - DOMAIN-SUFFIX,ieee.org,Academic Research
  - DOMAIN-SUFFIX,springer.com,Academic Research
  - DOMAIN-SUFFIX,nature.com,Academic Research
  - DOMAIN-SUFFIX,bing.com,Microsoft Global
  - DOMAIN-SUFFIX,bing.net,Microsoft Global
  - DOMAIN-SUFFIX,bingapis.com,Microsoft Global
  - DOMAIN-SUFFIX,copilot.microsoft.com,Microsoft Global
  - DOMAIN-SUFFIX,azure.com,Microsoft Global
  - DOMAIN-SUFFIX,azureedge.net,Microsoft Global
  - DOMAIN-SUFFIX,microsoft.com,Microsoft Services
  - DOMAIN-SUFFIX,office.com,Microsoft Services
  - DOMAIN-SUFFIX,live.com,Microsoft Services
  - DOMAIN-SUFFIX,apple.com,Apple Services
  - DOMAIN-SUFFIX,icloud.com,Apple Services
  - DOMAIN-SUFFIX,xbox.com,Game Platforms
  - DOMAIN-SUFFIX,xboxlive.com,Game Platforms
  - DOMAIN-SUFFIX,steampowered.com,Game Platforms
  - DOMAIN-SUFFIX,steamcommunity.com,Game Platforms
  - DOMAIN-SUFFIX,steamcontent.com,Game Downloads
  - DOMAIN-SUFFIX,telegram.org,Social & Messaging
  - DOMAIN-SUFFIX,t.me,Social & Messaging
  - DOMAIN-SUFFIX,twitter.com,Social & Messaging
  - DOMAIN-SUFFIX,x.com,Social & Messaging
  - DOMAIN-SUFFIX,youtube.com,Streaming Media
  - DOMAIN-SUFFIX,googlevideo.com,Streaming Media
