mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: true
find-process-mode: strict
geodata-mode: true
geodata-loader: standard
geox-url:
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
tun:
  enable: false
  stack: system
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack: ["any:53", "tcp://any:53"]
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - localhost
    - +.lan
    - +.local
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:private,cn":
      - 223.5.5.5
      - 119.29.29.29
proxies: []
proxy-groups:
  - name: US-West Entry
    type: select
    proxies: [DIRECT]
  - name: Hong Kong Entry
    type: select
    proxies: [DIRECT]
  - name: Europe Entry
    type: select
    proxies: [DIRECT]
  - name: Default Exit
    type: select
    proxies: [DIRECT]
  - name: Direct Route
    type: select
    proxies: [DIRECT]
  - name: AI Services
    type: select
    proxies: [Default Exit, DIRECT]
  - name: Developer Tools
    type: select
    proxies: [Default Exit, DIRECT]
  - name: Academic Research
    type: select
    proxies: [Default Exit, DIRECT]
  - name: Microsoft Services
    type: select
    proxies: [Direct Route, Default Exit]
  - name: Microsoft Global
    type: select
    proxies: [Default Exit, DIRECT]
  - name: Apple Services
    type: select
    proxies: [Direct Route, Default Exit]
  - name: Game Platforms
    type: select
    proxies: [Default Exit, DIRECT]
  - name: Game Downloads
    type: select
    proxies: [Direct Route, Default Exit]
  - name: Social & Messaging
    type: select
    proxies: [Default Exit, DIRECT]
  - name: Streaming Media
    type: select
    proxies: [Default Exit, DIRECT]
  - name: UDP Guard
    type: select
    proxies: [Default Exit, DIRECT, REJECT]
  - name: Catch-All
    type: select
    proxies: [Default Exit, DIRECT]
  - name: WebRTC Guard
    type: select
    proxies: [REJECT, Default Exit, DIRECT]
  - name: QUIC Guard
    type: select
    proxies: [REJECT, Default Exit, DIRECT]
  - name: Ad Block
    type: select
    proxies: [REJECT, DIRECT, Default Exit]
  - name: Legacy Ports
    type: select
    proxies: [REJECT, DIRECT, Default Exit]
rules:
  - DST-PORT,25,Legacy Ports
  - DST-PORT,3306,Legacy Ports
  - AND,((NETWORK,UDP),(DST-PORT,443)),QUIC Guard
  - AND,((NETWORK,UDP),(DST-PORT,3478-3481)),WebRTC Guard
  - GEOSITE,category-ads-all,Ad Block
  - GEOSITE,private,Direct Route
  - IP-CIDR,127.0.0.0/8,Direct Route,no-resolve
  - IP-CIDR,10.0.0.0/8,Direct Route,no-resolve
  - IP-CIDR,172.16.0.0/12,Direct Route,no-resolve
  - IP-CIDR,192.168.0.0/16,Direct Route,no-resolve
  - IP-CIDR,169.254.0.0/16,Direct Route,no-resolve
  - IP-CIDR6,::1/128,Direct Route,no-resolve
  - IP-CIDR6,fc00::/7,Direct Route,no-resolve
  - IP-CIDR6,fe80::/10,Direct Route,no-resolve
  - DOMAIN-SUFFIX,openai.com,AI Services
  - DOMAIN-SUFFIX,chatgpt.com,AI Services
  - DOMAIN-SUFFIX,oaistatic.com,AI Services
  - DOMAIN-SUFFIX,oaiusercontent.com,AI Services
  - DOMAIN-SUFFIX,anthropic.com,AI Services
  - DOMAIN-SUFFIX,claude.ai,AI Services
  - DOMAIN-SUFFIX,perplexity.ai,AI Services
  - DOMAIN-SUFFIX,huggingface.co,AI Services
  - DOMAIN-SUFFIX,hf.co,AI Services
  - DOMAIN-SUFFIX,github.com,Developer Tools
  - DOMAIN-SUFFIX,githubusercontent.com,Developer Tools
  - DOMAIN-SUFFIX,npmjs.org,Developer Tools
  - DOMAIN-SUFFIX,pypi.org,Developer Tools
